# Runs the liquidity-rewards paper bot on a GitHub-hosted runner, 6 hours at a time, and publishes
# rewards_state.json + the dashboard to the gh-pages branch every 5 minutes.
name: rewards-bot
on:
  schedule:
    - cron: "3 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rewards-bot
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: live
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Run the bot and publish its state every 5 minutes
        run: |
          set +e
          cp live/rewards_state.json rewards_state.json 2>/dev/null || true
          cp live/rewards_slow_state.json rewards_slow_state.json 2>/dev/null || true
          cp live/rewards_max_pess_state.json rewards_max_pess_state.json 2>/dev/null || true
          cp live/rewards_slow_pess_state.json rewards_slow_pess_state.json 2>/dev/null || true
          python rewards_paper.py --state rewards_state.json > bot.log 2>&1 &
          BOT=$!
          python rewards_paper.py --state rewards_slow_state.json --profile slow --min-days-left 3 --min-rate 10 > bot_slow.log 2>&1 &
          BOT2=$!
          python rewards_paper.py --state rewards_max_pess_state.json --pessimistic > bot_max_pess.log 2>&1 &
          BOT3=$!
          python rewards_paper.py --state rewards_slow_pess_state.json --profile slow --min-days-left 3 --min-rate 10 --pessimistic > bot_slow_pess.log 2>&1 &
          BOT4=$!
          git -C live config user.name "rewards-bot"
          git -C live config user.email "rewards-bot@users.noreply.github.com"
          publish() {
            [ -f rewards_state.json ] || return 0
            for i in 1 2 3; do
              (cd live && git pull -q --rebase -X theirs || git rebase --abort) 2>/dev/null
              cp rewards_state.json live/rewards_state.json
              for f in rewards_slow_state.json rewards_max_pess_state.json rewards_slow_pess_state.json; do [ -f "$f" ] && cp "$f" "live/$f"; done
              { echo '<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>'; cat dashboard.html; echo '</body></html>'; } > live/index.html
              (cd live && git add -A && git commit -qm "rewards $(date -u +%FT%TZ)" ; git push -q) && break
              sleep 5
            done
          }
          END=$(( $(date +%s) + 350*60 ))
          while [ "$(date +%s)" -lt "$END" ] && kill -0 "$BOT" 2>/dev/null; do
            sleep 300
            publish
          done
          kill "$BOT" "$BOT2" "$BOT3" "$BOT4" 2>/dev/null; sleep 2
          publish
          echo "--- bot log tail"; tail -40 bot.log; echo "--- slow bot log tail"; tail -40 bot_slow.log; tail -20 bot_max_pess.log bot_slow_pess.log
